name: demo-server
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Start CodeGuard AI
        run: |
          HOST=0.0.0.0 PORT=8848 nohup node src/server.js > /tmp/app.log 2>&1 &
          sleep 3
          curl -sf http://127.0.0.1:8848/api/meta/health | head -c 300
          echo

      - name: Expose public URL
        run: |
          curl -sL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          nohup ./cloudflared tunnel --url http://127.0.0.1:8848 > /tmp/tunnel.log 2>&1 &
          for i in $(seq 1 40); do
            grep -m1 -o 'https://[^ ]*trycloudflare.com' /tmp/tunnel.log && break
            sleep 3
          done
          URL=$(grep -m1 -o 'https://[^ ]*trycloudflare.com' /tmp/tunnel.log)
          echo "URL=$URL" >> "$GITHUB_ENV"
          echo "## CodeGuard AI demo URL" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$URL" > demo-url.txt
          curl -sf "$URL/api/meta/health" | head -c 200
          echo

      - name: Publish URL to repo
        run: |
          git config user.name 'yanbo-yabao'
          git config user.email '268906466+yanbo-yabao@users.noreply.github.com'
          git add demo-url.txt
          git commit -m 'chore: update demo URL' || true
          git push || true

      - name: Keep alive (demo window)
        run: sleep 330m
