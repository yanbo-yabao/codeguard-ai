<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" width="1240" height="820" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4d5866"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111821"/>
      <stop offset="100%" stop-color="#0b0f14"/>
    </linearGradient>
  </defs>

  <rect width="1240" height="820" fill="url(#bg)"/>

  <text x="40" y="52" fill="#e6edf3" font-size="24" font-weight="700">CodeGuard AI 技术架构</text>
  <text x="40" y="78" fill="#8b98a5" font-size="13">零运行时第三方依赖 · Node.js 内置模块实现 · 静态规则引擎与大模型语义评审双引擎协同</text>

  <!-- ============ 接入层 ============ -->
  <rect x="40" y="104" width="1160" height="106" rx="10" fill="#141a22" stroke="#232c37"/>
  <text x="60" y="130" fill="#8b98a5" font-size="12" font-weight="600" letter-spacing="1">接入层 · ACCESS</text>

  <g font-size="13" fill="#e6edf3" text-anchor="middle">
    <rect x="60" y="144" width="200" height="50" rx="8" fill="#182029" stroke="#2f81f7"/>
    <text x="160" y="165">Web 评审台</text>
    <text x="160" y="183" fill="#8b98a5" font-size="11">原生 HTML/CSS/JS · SVG 自绘图表</text>

    <rect x="282" y="144" width="200" height="50" rx="8" fill="#182029" stroke="#2f81f7"/>
    <text x="382" y="165">命令行工具 CLI</text>
    <text x="382" y="183" fill="#8b98a5" font-size="11">review / serve / doctor / rules</text>

    <rect x="504" y="144" width="220" height="50" rx="8" fill="#182029" stroke="#2f81f7"/>
    <text x="614" y="165">REST API（14 个接口）</text>
    <text x="614" y="183" fill="#8b98a5" font-size="11">JSON / Markdown / HTML / SARIF</text>

    <rect x="746" y="144" width="200" height="50" rx="8" fill="#182029" stroke="#2f81f7"/>
    <text x="846" y="165">CI 质量门禁</text>
    <text x="846" y="183" fill="#8b98a5" font-size="11">退出码约定 · 可接入流水线</text>

    <rect x="968" y="144" width="212" height="50" rx="8" fill="#182029" stroke="#4d5866" stroke-dasharray="4 3"/>
    <text x="1074" y="165">Gitee 平台集成</text>
    <text x="1074" y="183" fill="#8b98a5" font-size="11">私人令牌 · 只读拉取（可选）</text>
  </g>

  <line x1="160" y1="210" x2="160" y2="238" stroke="#4d5866" marker-end="url(#arrow)"/>
  <line x1="382" y1="210" x2="382" y2="238" stroke="#4d5866" marker-end="url(#arrow)"/>
  <line x1="614" y1="210" x2="614" y2="238" stroke="#4d5866" marker-end="url(#arrow)"/>
  <line x1="846" y1="210" x2="846" y2="238" stroke="#4d5866" marker-end="url(#arrow)"/>

  <!-- ============ 服务层 ============ -->
  <rect x="40" y="240" width="1160" height="132" rx="10" fill="#141a22" stroke="#232c37"/>
  <text x="60" y="266" fill="#8b98a5" font-size="12" font-weight="600" letter-spacing="1">服务层 · SERVICE</text>

  <g font-size="13" fill="#e6edf3" text-anchor="middle">
    <rect x="60" y="280" width="222" height="76" rx="8" fill="#182029" stroke="#2f81f7"/>
    <text x="171" y="303">HTTP 微框架</text>
    <text x="171" y="322" fill="#8b98a5" font-size="11">路由 / 中间件 / 上下文</text>
    <text x="171" y="339" fill="#8b98a5" font-size="11">静态资源 + 路径穿越防御</text>

    <rect x="300" y="280" width="222" height="76" rx="8" fill="#182029" stroke="#2f81f7"/>
    <text x="411" y="303">评审服务（编排）</text>
    <text x="411" y="322" fill="#8b98a5" font-size="11">输入校验 → 双引擎调度</text>
    <text x="411" y="339" fill="#8b98a5" font-size="11">结果融合 → 持久化</text>

    <rect x="540" y="280" width="200" height="76" rx="8" fill="#182029" stroke="#2f81f7"/>
    <text x="640" y="303">评分卡模型</text>
    <text x="640" y="322" fill="#8b98a5" font-size="11">加权扣分 · 规模归一化</text>
    <text x="640" y="339" fill="#8b98a5" font-size="11">五维得分 · 等级划分</text>

    <rect x="758" y="280" width="200" height="76" rx="8" fill="#182029" stroke="#2f81f7"/>
    <text x="858" y="303">报告导出</text>
    <text x="858" y="322" fill="#8b98a5" font-size="11">Markdown / HTML</text>
    <text x="858" y="339" fill="#8b98a5" font-size="11">JSON / SARIF 2.1.0</text>

    <rect x="976" y="280" width="204" height="76" rx="8" fill="#182029" stroke="#2f81f7"/>
    <text x="1078" y="303">记录存储</text>
    <text x="1078" y="322" fill="#8b98a5" font-size="11">JSON 原子写入</text>
    <text x="1078" y="339" fill="#8b98a5" font-size="11">内存索引 + 崩溃恢复</text>
  </g>

  <line x1="300" y1="372" x2="300" y2="400" stroke="#4d5866" marker-end="url(#arrow)"/>
  <line x1="760" y1="372" x2="760" y2="400" stroke="#4d5866" marker-end="url(#arrow)"/>

  <!-- ============ 双引擎 ============ -->
  <rect x="40" y="402" width="568" height="248" rx="10" fill="#101720" stroke="#2da44e"/>
  <text x="60" y="428" fill="#2da44e" font-size="12" font-weight="600" letter-spacing="1">引擎 A · 静态规则分析（离线可用 · 确定性）</text>

  <g font-size="12.5" fill="#e6edf3" text-anchor="middle">
    <rect x="60" y="442" width="164" height="62" rx="8" fill="#182029" stroke="#2da44e"/>
    <text x="142" y="464">语言画像</text>
    <text x="142" y="482" fill="#8b98a5" font-size="11">17 种语言词法规则</text>
    <text x="142" y="497" fill="#8b98a5" font-size="11">注释/字符串分离</text>

    <rect x="240" y="442" width="164" height="62" rx="8" fill="#182029" stroke="#2da44e"/>
    <text x="322" y="464">度量引擎</text>
    <text x="322" y="482" fill="#8b98a5" font-size="11">圈复杂度 / 嵌套深度</text>
    <text x="322" y="497" fill="#8b98a5" font-size="11">函数识别 / 注释率</text>

    <rect x="420" y="442" width="168" height="62" rx="8" fill="#182029" stroke="#2da44e"/>
    <text x="504" y="464">规则库（41 条）</text>
    <text x="504" y="482" fill="#8b98a5" font-size="11">安全 11 · 缺陷 10</text>
    <text x="504" y="497" fill="#8b98a5" font-size="11">性能 6 · 风格 14</text>
  </g>

  <rect x="60" y="518" width="528" height="114" rx="8" fill="#0f151c" stroke="#1e2a35"/>
  <text x="76" y="540" fill="#8b98a5" font-size="11.5">扫描通道</text>
  <g font-size="11.5" fill="#cdd9e5">
    <text x="76" y="562">code 通道　：注释已剥离、字符串保留 → 用于凭据与字面量检测</text>
    <text x="76" y="582">syntax 通道：注释与字符串均剥离 → 用于运算符与关键字检测</text>
    <text x="76" y="602">comment 通道：仅注释 → 用于 TODO / FIXME 与技术债识别</text>
    <text x="76" y="622">三通道长度与行号严格对齐，命中结果可精确回溯到原始行</text>
  </g>

  <rect x="632" y="402" width="568" height="248" rx="10" fill="#101720" stroke="#a371f7"/>
  <text x="652" y="428" fill="#a371f7" font-size="12" font-weight="600" letter-spacing="1">引擎 B · 大模型语义评审（可选增强 · 可降级）</text>

  <g font-size="12.5" fill="#e6edf3" text-anchor="middle">
    <rect x="652" y="442" width="164" height="62" rx="8" fill="#182029" stroke="#a371f7"/>
    <text x="734" y="464">LLM 客户端</text>
    <text x="734" y="482" fill="#8b98a5" font-size="11">OpenAI 兼容协议</text>
    <text x="734" y="497" fill="#8b98a5" font-size="11">重试 / 超时 / 脱敏</text>

    <rect x="832" y="442" width="164" height="62" rx="8" fill="#182029" stroke="#a371f7"/>
    <text x="914" y="464">多角色专家</text>
    <text x="914" y="482" fill="#8b98a5" font-size="11">安全 / 缺陷 / 性能</text>
    <text x="914" y="497" fill="#8b98a5" font-size="11">可维护性（并发调度）</text>

    <rect x="1012" y="442" width="168" height="62" rx="8" fill="#182029" stroke="#a371f7"/>
    <text x="1096" y="464">修复建议生成</text>
    <text x="1096" y="482" fill="#8b98a5" font-size="11">上下文感知补丁</text>
    <text x="1096" y="497" fill="#8b98a5" font-size="11">失败回退内置模板</text>
  </g>

  <rect x="652" y="518" width="528" height="114" rx="8" fill="#0f151c" stroke="#1e2a35"/>
  <text x="668" y="540" fill="#8b98a5" font-size="11.5">工程保障</text>
  <g font-size="11.5" fill="#cdd9e5">
    <text x="668" y="562">分段审查　：超长文件按空行对齐切块，避免上下文溢出且保持语义完整</text>
    <text x="668" y="582">并发受控　：并发度可配置，避免触发服务端速率限制</text>
    <text x="668" y="602">优雅降级　：任一角色失败不影响其余角色；全部失败仍输出规则引擎结论</text>
    <text x="668" y="622">离线模拟　：mock 提供者保证断网与单元测试可完整复现</text>
  </g>

  <line x1="324" y1="650" x2="324" y2="678" stroke="#4d5866" marker-end="url(#arrow)"/>
  <line x1="916" y1="650" x2="916" y2="678" stroke="#4d5866" marker-end="url(#arrow)"/>

  <!-- ============ 支撑层 ============ -->
  <rect x="40" y="680" width="1160" height="104" rx="10" fill="#141a22" stroke="#232c37"/>
  <text x="60" y="706" fill="#8b98a5" font-size="12" font-weight="600" letter-spacing="1">支撑层 · FOUNDATION</text>

  <g font-size="12.5" fill="#e6edf3" text-anchor="middle">
    <rect x="60" y="718" width="212" height="48" rx="8" fill="#182029" stroke="#4d5866"/>
    <text x="166" y="738">配置中心</text>
    <text x="166" y="756" fill="#8b98a5" font-size="11">自研 dotenv · 自检 · 脱敏</text>

    <rect x="292" y="718" width="212" height="48" rx="8" fill="#182029" stroke="#4d5866"/>
    <text x="398" y="738">日志与错误体系</text>
    <text x="398" y="756" fill="#8b98a5" font-size="11">分级输出 · 稳定错误码</text>

    <rect x="524" y="718" width="212" height="48" rx="8" fill="#182029" stroke="#4d5866"/>
    <text x="630" y="738">分类字典</text>
    <text x="630" y="756" fill="#8b98a5" font-size="11">5 级 5 维 · 权重集中管理</text>

    <rect x="756" y="718" width="212" height="48" rx="8" fill="#182029" stroke="#4d5866"/>
    <text x="862" y="738">单元测试</text>
    <text x="862" y="756" fill="#8b98a5" font-size="11">node:test · 95 个用例</text>

    <rect x="988" y="718" width="192" height="48" rx="8" fill="#182029" stroke="#4d5866"/>
    <text x="1084" y="738">容器化部署</text>
    <text x="1084" y="756" fill="#8b98a5" font-size="11">Dockerfile + Compose</text>
  </g>
</svg>
